repos:
-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
-   repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
    -   id: bandit
        args: []
-   repo: https://github.com/pylint-dev/pylint
    rev: v3.1.0
    hooks:
    -   id: pylint
        additional_dependencies:
        - pygame
        - pyaudio
-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: ./run_tests.sh
        language: script
        types: [python]
